[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dragon-semra"
version = "0.1.0"
description = "Semra-structured enrichment pipeline inspired by Dragon AI"
authors = [{ name = "Dragon-Semra Maintainers" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "rdflib>=6.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
dragon-semra = "dragon_semra.cli:main"
